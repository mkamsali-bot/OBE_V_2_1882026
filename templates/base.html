<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>{{ title }}</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>

        body{
            background:#f4f6f9;
            font-family:"Segoe UI",Tahoma,Verdana,sans-serif;
        }

        .header{
            background:#003366;
            color:white;
            padding:15px;
        }

        .header h2{
            margin:0;
            font-weight:700;
        }

        .header p{
            margin:0;
            font-size:15px;
        }

        .navbar{
            background:#005792;
        }

        .navbar .nav-link{
            color:white !important;
            font-weight:500;
            margin-right:15px;
        }

        .navbar .nav-link:hover{
            color:#ffd54f !important;
        }

        .content{
            margin-top:25px;
            margin-bottom:30px;
        }

        .card{
            border:none;
            box-shadow:0 2px 8px rgba(0,0,0,.10);
        }

        footer{
            background:#003366;
            color:white;
            text-align:center;
            padding:10px;
            margin-top:40px;
        }

        .required{
            color:red;
        }

    </style>

</head>

<body>

<div class="header">

    <div class="container-fluid">

        <h2>OBE Analytics Pro</h2>

        <p>Outcome Based Education (OBE) CO-PO Attainment System</p>

    </div>

</div>

<nav class="navbar navbar-expand-lg">

<div class="container-fluid">

<ul class="navbar-nav">

<li class="nav-item">
<a class="nav-link" href="/">Home</a>
</li>

<li class="nav-item">
<a class="nav-link" href="/department">Department</a>
</li>

<li class="nav-item">
<a class="nav-link" href="#">Program</a>
</li>

<li class="nav-item">
<a class="nav-link" href="#">Faculty</a>
</li>

<li class="nav-item">
<a class="nav-link" href="#">Course</a>
</li>

<li class="nav-item">
<a class="nav-link" href="#">Outcomes</a>
</li>

<li class="nav-item">
<a class="nav-link" href="#">Marks</a>
</li>

<li class="nav-item">
<a class="nav-link" href="#">Reports</a>
</li>

</ul>

</div>

</nav>

<div class="container content">

{% block content %}

{% endblock %}

</div>

<footer>

OBE Analytics Pro Version 0.2

</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
